services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mosk
      POSTGRES_PASSWORD: mosk
      POSTGRES_DB: mosk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosk -d mosk"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql://mosk:mosk@db:5432/mosk?schema=public
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./server
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://mosk:mosk@db:5432/mosk?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
